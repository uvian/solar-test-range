name: Build AutoCAD Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# GITHUB_TOKEN 默认只有 read 权限，上传 release 资产必须显式声明 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore SolarTestRange.sln

    - name: Build
      run: dotnet build SolarTestRange.sln -c Release --no-restore

    - name: Create bundle package
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path bundle\SolarTestRange.bundle\Contents | Out-Null
        Copy-Item src\SolarTestRange\bin\Release\net472\SolarTestRange.dll bundle\SolarTestRange.bundle\Contents\
        Copy-Item PackageContents.xml bundle\SolarTestRange.bundle\
        Copy-Item HUATU.lsp bundle\

        # 清单必须能解析且是纯 ASCII，否则 AutoCAD 静默跳过整个 bundle。
        # v1.1.1 就是在这里翻车：中文被存成 '?' 导致属性引号丢失，全员不自动加载。
        pwsh -NoProfile -File tools\Test-Bundle.ps1 -Path bundle\SolarTestRange.bundle
        if ($LASTEXITCODE -ne 0) { throw "bundle 清单校验失败，已阻止发布" }

        # 不要用 Compress-Archive：它把条目名写成反斜杠分隔，Windows 资源管理器
        # 解压后目录结构会错乱（有人能用有人不能用）。用 Windows 自带 bsdtar。
        Remove-Item bundle\SolarTestRange.bundle.zip -Force -ErrorAction SilentlyContinue
        tar -a -c -f bundle\SolarTestRange.bundle.zip -C bundle SolarTestRange.bundle HUATU.lsp
        if ($LASTEXITCODE -ne 0) { throw "tar 打包失败 (exit $LASTEXITCODE)" }

        pwsh -NoProfile -File tools\Test-Bundle.ps1 -Path bundle\SolarTestRange.bundle.zip
        if ($LASTEXITCODE -ne 0) { throw "zip 校验失败，已阻止发布" }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SolarTestRange
        path: |
          src/SolarTestRange/bin/Release/net472/SolarTestRange.dll
          bundle/SolarTestRange.bundle.zip
          HUATU.lsp

    - name: Upload to Release (tagged only)
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 注意：本步骤是 PowerShell，不能写 bash 的 2>/dev/null（会被当成写文件 D:\dev\null）
        # tag 必须用 ${{ github.ref_name }}，不能写死
        # PowerShell 不会因原生命令非零退出而中断，必须显式检查 $LASTEXITCODE
        $ErrorActionPreference = 'Stop'
        $tag = "${{ github.ref_name }}"
        $assets = @(
          'src/SolarTestRange/bin/Release/net472/SolarTestRange.dll',
          'bundle/SolarTestRange.bundle.zip',
          'HUATU.lsp'
        )
        foreach ($a in $assets) {
          Write-Host "uploading $a ..."
          gh release upload $tag $a --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $a (exit $LASTEXITCODE)" }
        }
        Write-Host "release upload done: $tag"
